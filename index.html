<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- Configuration ---
    const WORKER_URL = "https://trafficdata.olivesom3a.workers.dev/"; 
    const ALEX_CENTER = [31.2001, 29.9187];
    
    // Map Init (CartoDB Positron - Light)
    const map = L.map('map', {zoomControl: false}).setView(ALEX_CENTER, 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO', maxZoom: 20 }).addTo(map);

    const layers = {
        flow: L.layerGroup().addTo(map),
        incidents: L.layerGroup().addTo(map),
        routing: L.layerGroup().addTo(map),
        signals: L.layerGroup(),
        cameras: L.layerGroup(),
        hotspots: L.layerGroup().addTo(map) 
    };

    let globalIncidents = [];

    // --- Data Loaders ---
    function loadFlow() {
        const url = `${WORKER_URL}?type=flow_tile&x={x}&y={y}&z={z}`; // Using Worker Proxy
        layers.flow.clearLayers();
        L.tileLayer(url, { maxZoom: 22, opacity: 0.8 }).addTo(layers.flow);
    }

    async function fetchIncidents() {
        const url = `${WORKER_URL}?type=traffic`;
        try {
            const res = await fetch(url).then(r=>r.json());
            if(res.incidents) { globalIncidents = res.incidents; applyTimeFilter(24); }
        } catch(e) { console.error("Traffic Error", e); }
    }

    async function loadSignals() {
        if(layers.signals.getLayers().length > 0) return;
        const url = `${WORKER_URL}?type=signals`;
        try {
            const data = await fetch(url).then(r => r.json());
            const features = data.features || data;
            
            features.forEach(f => {
                // Handling GeoJSON [Lon, Lat] -> Leaflet [Lat, Lon]
                const coords = f.geometry ? f.geometry.coordinates : [0,0];
                const lat = coords[1];
                const lng = coords[0];
                const name = f.properties ? f.properties.name : "إشارة";

                if(lat && lng) {
                    const icon = L.divIcon({html: `<div class="signal-icon"><span class="material-symbols-outlined text-[10px]">traffic</span></div>`, className: ''});
                    L.marker([lat, lng], {icon:icon}).bindPopup(`<b class="text-primary">${name || 'إشارة مرورية'}</b>`).addTo(layers.signals);
                }
            });
        } catch(e) { console.error("Signals Error", e); }
    }

    async function loadHotspots() {
        if(layers.hotspots.getLayers().length > 0) return;
        const url = `${WORKER_URL}?type=hotspots`;
        try {
            const data = await fetch(url).then(r => r.json());
            const features = data.features || data;

            features.forEach(f => {
                const coords = f.geometry ? f.geometry.coordinates : [0,0];
                const lat = coords[1];
                const lng = coords[0];
                // Reading Arabic Properties from your JSON structure
                const p = f.properties || {};
                const name = p['اسم_النقطة_الساخنة'] || "تجمع مياه";
                const solution = p['الحل_المقترح'] || "";

                if(lat && lng) {
                    const icon = L.divIcon({html: `<div class="hotspot-icon"><span class="material-symbols-outlined text-[12px]">water_drop</span></div>`, className: ''});
                    const popup = `<div class="text-right"><b class="text-hotspot block mb-1 text-sm">نقطة ساخنة</b><div class="text-sm font-bold text-white mb-1">${name}</div>${solution ? `<div class="text-xs text-white/60 bg-white/5 p-1 rounded">💡 ${solution}</div>` : ''}</div>`;
                    L.marker([lat, lng], {icon:icon}).bindPopup(popup).addTo(layers.hotspots);
                }
            });
        } catch(e) { console.error("Hotspots Error", e); }
    }

    // --- UI Logic ---
    window.applyTimeFilter = (hours) => {
        document.getElementById('time-display').innerText = `آخر ${hours} ساعة`;
        document.getElementById('timeline-fill').style.width = (hours/24*100) + '%';
        layers.incidents.clearLayers();
        const cutoff = new Date(Date.now() - (hours * 3600000));
        let count = 0, listHTML = '';

        globalIncidents.forEach(inc => {
            if(new Date(inc.properties.startTime) < cutoff) return;
            count++;
            const p = inc.properties;
            let col='#0ea5e9', icon='info', lbl='تنبيه', txtCol='text-primary';
            if(p.iconCategory===1) { col='#ef4444'; icon='car_crash'; lbl='حادث'; txtCol='text-danger'; }
            else if(p.iconCategory===9) { col='#f59e0b'; icon='construction'; lbl='أعمال'; txtCol='text-warning'; }
            else if(p.iconCategory===6) { col='#be123c'; icon='block'; lbl='مغلق'; txtCol='text-hotspot'; }

            const popup = `<div class="font-bold text-right"><span style="color:${col}">${lbl}</span><br><span class="text-xs text-white/70">${p.events[0].description}</span></div>`;
            
            let latLng;
            if(inc.geometry.type==='LineString') {
                latLng = [inc.geometry.coordinates[0][1], inc.geometry.coordinates[0][0]];
                L.polyline(inc.geometry.coordinates.map(c=>[c[1],c[0]]), {color:col, weight:5, opacity:0.7}).bindPopup(popup).addTo(layers.incidents);
            } else {
                latLng = [inc.geometry.coordinates[1],inc.geometry.coordinates[0]];
            }
            const marker = L.divIcon({html: `<div class="pulse-marker" style="background:${col}; box-shadow:0 0 10px ${col}40; border-color:white;"><span class="material-symbols-outlined text-[14px]">${icon}</span></div>`, className: ''});
            L.marker(latLng, {icon:marker}).bindPopup(popup).addTo(layers.incidents);

            listHTML += `<div class="alert-item group" onclick="map.setView([${latLng}], 16)"><div class="flex items-center justify-between mb-1"><span class="text-xs font-bold ${txtCol} flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">${icon}</span> ${lbl}</span><span class="text-[10px] text-white/30 font-mono">${new Date(p.startTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><p class="text-[11px] text-white/70 line-clamp-1 font-medium">${p.events[0].description}</p></div>`;
        });

        document.getElementById('alerts-list').innerHTML = listHTML || '<div class="text-center text-white/30 text-xs py-8">لا توجد تنبيهات</div>';
        document.getElementById('incidents-count').innerText = count;
        document.getElementById('congestion-idx').innerText = Math.min(100, Math.round(count * 2.2)) + '%';
        document.getElementById('avg-speed').innerText = Math.max(10, 65 - Math.round(count/2));
    };

    // --- Scenario ---
    let sc = {mode:null,s:null,e:null,blkRect:null,blkBounds:null};
    window.toggleScenarioPanel = () => { const el=document.getElementById('scenarioPanel'); el.style.display=el.style.display==='block'?'none':'block'; };
    window.setMode = m => { sc.mode=m; document.getElementById('status-msg').innerText = m==='block'?'اضغط لرسم منطقة الإغلاق':'حدد المكان'; };
    map.on('click', e => {
        if(!sc.mode)return;
        const {lat,lng}=e.latlng;
        if(sc.mode==='start'){ if(sc.s)map.removeLayer(sc.s); sc.s=L.marker([lat,lng],{icon:L.divIcon({html:'<div class="w-4 h-4 bg-success rounded-full border-2 border-white shadow"></div>',className:''})}).addTo(layers.routing); }
        else if(sc.mode==='end'){ if(sc.e)map.removeLayer(sc.e); sc.e=L.marker([lat,lng],{icon:L.divIcon({html:'<div class="w-4 h-4 bg-primary rounded-full border-2 border-white shadow"></div>',className:''})}).addTo(layers.routing); }
        else if(sc.mode==='block'){ const d=0.0002; const b=[[lat-d,lng-d],[lat+d,lng+d]]; if(sc.blkRect)map.removeLayer(sc.blkRect); sc.blkRect=L.rectangle(b,{color:'#ef4444',weight:2,fillOpacity:0.5}).addTo(layers.routing); sc.blkBounds=sc.blkRect.getBounds(); }
        sc.mode=null; document.getElementById('status-msg').innerText='تم التحديد';
    });

  window.calculateScenario = async () => {
        // التحقق من وجود نقاط البداية والنهاية
        if(!sc.s || !sc.e) return;
        
        // إظهار مؤشر التحميل
        document.getElementById('sc-result').innerHTML = '<div class="text-center text-xs text-primary animate-pulse py-2">جاري حساب المسارات...</div>';
        
        // يتم إرسال الإحداثيات كـ Query Parameters للوركر
        const url = `${WORKER_URL}?type=route&s=${sc.s.getLatLng().lat},${sc.s.getLatLng().lng}&e=${sc.e.getLatLng().lat},${sc.e.getLatLng().lng}`;
        
        // 2. إعداد خيارات الطلب (Options)
        let opts = {
            method: 'GET' // الافتراضي هو GET للمسارات العادية
        };

        if(sc.blkBounds) {
            const ne = sc.blkBounds.getNorthEast();
            const sw = sc.blkBounds.getSouthWest();
            opts = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "avoidAreas": {
                        "rectangles": [{
                            "southWestCorner": { "latitude": sw.lat, "longitude": sw.lng },
                            "northEastCorner": { "latitude": ne.lat, "longitude": ne.lng }
                        }]
                    }
                })
            };
        }

        try {
            const res = await fetch(url, opts).then(r => r.json());
            
            layers.routing.eachLayer(l => { 
                if(l instanceof L.Polyline && !(l instanceof L.Rectangle)) layers.routing.removeLayer(l); 
            });

            if (res.routes && res.routes.length > 0) {
                let html = '';
                const colors = ['#10b981', '#a855f7', '#0ea5e9']; // ألوان المسارات الثلاثة
                
                res.routes.forEach((r, i) => {
                    // رسم الخط على الخريطة
                    const pts = r.legs[0].points.map(p => [p.latitude, p.longitude]);
                    L.polyline(pts, {
                        color: colors[i], 
                        weight: i===0 ? 6 : 4, // المسار الأول (الأسرع) يكون أسمك
                        opacity: i===0 ? 0.9 : 0.6
                    }).addTo(layers.routing);
                    
                    const time = Math.round(r.summary.travelTimeInSeconds / 60);
                    const dist = (r.summary.lengthInMeters / 1000).toFixed(1);

                    html += `
                    <div class="bg-white/5 border-r-4 p-3 rounded mb-2 text-xs flex justify-between items-center hover:bg-white/10 transition-colors cursor-pointer" style="border-color:${colors[i]}">
                        <div>
                            <span class="font-bold text-white block text-sm">مسار ${i+1} ${i===0 ? '(الأسرع)' : ''}</span>
                            <span class="text-white/50">${dist} كم</span>
                        </div>
                        <span class="text-lg font-bold text-primary">${time} د</span>
                    </div>`;
                });
                document.getElementById('sc-result').innerHTML = html;
            } else {
                document.getElementById('sc-result').innerHTML = '<div class="text-center text-danger text-xs py-2">عفواً، الطريق مغلق ولا يوجد بديل متاح!</div>';
            }
        } catch(e) { 
            console.error("Routing Error", e); 
            document.getElementById('sc-result').innerHTML = '<div class="text-center text-warning text-xs py-2">حدث خطأ في الاتصال بالسيرفر</div>';
        }
    };
    window.resetScenario = () => { layers.routing.clearLayers(); sc={mode:null,s:null,e:null,blkRect:null,blkBounds:null}; document.getElementById('sc-result').innerHTML=''; };

    // --- Toggles ---
    window.toggleLayer = (n,b) => {
        if(map.hasLayer(layers[n])) { map.removeLayer(layers[n]); if(b) b.classList.remove('active-tool'); }
        else { map.addLayer(layers[n]); if(b) b.classList.add('active-tool'); if(n==='signals')loadSignals(); if(n==='hotspots')loadHotspots(); }
    };
    async function handleSearch(e){
        if(e.key==='Enter'){
            const q=document.getElementById('searchInput').value; if(!q)return;
            const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}+Alexandria+Egypt&limit=1`).then(r=>r.json());
            if(res.length){ map.setView([res[0].lat,res[0].lon],16); L.popup().setLatLng([res[0].lat,res[0].lon]).setContent(`<div class="text-right text-black font-bold p-1">${res[0].display_name.split(',')[0]}</div>`).openOn(map); }
        }
    }

    // Init
    loadFlow(); fetchIncidents(); setInterval(fetchIncidents, 120000); loadHotspots();
</script>
</body>
</html>
